<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホでの拡大縮小を防ぐ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東方風 スマホSTGデモ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">

    <div id="canvasWrapper" style="position: relative;">
      <canvas id="gameCanvas"></canvas>

      <!-- オーバーレイUI（初期状態は非表示） -->
      <div id="overlay" class="hidden">
        <h2 id="resultTitle">SPELL CARD CAPTURED</h2>
        <p id="resultSubtitle"></p>
        <div id="retryButton">リトライ</div>
        <div id="titleButton">タイトルへ戻る</div>
      </div>

      <!-- パスワード入力画面（初期表示） -->
      <div id="passwordScreen">
        <h1 class="gate-title">めざせ!東方再現スマホSTG<br><span class="gate-sub">- SPELL PRACTICE -</span></h1>
        <p class="gate-desc">合言葉を入力してください</p>

        <div class="input-box">
          <input type="password" id="passInput" placeholder="PASSWORD" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <div id="passError" class="pass-error hidden">合言葉が違います</div>
        </div>

        <button id="passSubmitBtn" class="pass-btn">幻想入りする</button>
      </div>

      <!-- タイトル画面オーバーレイ-->
      <div id="titleScreen" class="hidden">
        <div id="slowModeToggle" class="slow-mode-toggle">
          <span class="toggle-label">デフォルト低速: </span>
          <span id="slowModeStatus" class="toggle-status">OFF</span>
        </div>
        <h1 id="titleText">東方風スマホSTG<br><span style="font-size: 14px; letter-spacing: 2px; font-weight: normal; color: #ccc;">- スペルプラクティス -</span></h1>
        <p id="titleDesc">挑戦するスペルカードを選択してください</p>

        <div class="boss-select-btn" data-boss="okuu">
          <div class="spell-prefix">核符「ダンシングフレア」</div>
          <div class="boss-name">vs 霊烏路 空</div>
        </div>

        <div class="boss-select-btn" data-boss="kisume">
          <div class="spell-prefix">怪奇「水底より出でるは釣瓶」</div>
          <div class="boss-name">vs キスメ</div>
        </div>

        <div class="boss-select-btn" data-boss="kisume2">
          <div class="spell-prefix">釣瓶「仄暗い井戸の底から」</div>
          <div class="boss-name">vs キスメ</div>
        </div>

        <div class="boss-select-btn" data-boss="okuu2">
          <div class="spell-prefix">核符「Gフィールドアノマリー」</div>
          <div class="boss-name">vs 霊烏路 空</div>
        </div>

        <div class="boss-select-btn" data-boss="okuu_final">
          <div class="spell-prefix">「超新星爆発の残滓」</div>
          <div class="boss-name">vs 霊烏路 空</div>
        </div>
      </div>
    </div>

    <!-- 下部：操作ゾーン -->
    <div id="controlPad">
      <canvas id="joyCanvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none;"></canvas>
      <div id="slowButton">低速</div>
      <div id="bombButton">ボム</div>
      <p id="controlText">操作ゾーン</p>
    </div>

  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
